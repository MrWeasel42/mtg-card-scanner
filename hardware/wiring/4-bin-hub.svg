<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1260" viewBox="0 0 2000 1260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="2000" height="1260" fill="#f8fafc"/><text x="36.0" y="50.0" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">4 · Bin hub (back panel of bin module 2) and each bin's four parts</text><text x="36.0" y="80.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start">One 4-wire bus from the bay feeds the hub. Each bin's parts plug in on that bin's channel: channel N = bin N+1.</text><rect x="700" y="140" width="520" height="1000" rx="14" fill="#7c2d12" stroke="#022c22" stroke-width="2"/><circle cx="712" cy="152" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="1208" cy="152" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="712" cy="1128" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="1208" cy="1128" r="5" fill="#d1d5db" stroke="#022c22"/><text x="960.0" y="186.0" font-size="22" font-weight="800" fill="#ecfdf5" text-anchor="middle">Bin hub</text><text x="960.0" y="212.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">PCA9685 servo board (0x40)</text><text x="960.0" y="230.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">MCP23017 inputs (0x20)</text><text x="960.0" y="248.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">TCA9548A #1 (0x71) + #2 (0x72)</text><text x="960.0" y="266.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">3.3 V regulator D24V5F3</text><rect x="706" y="279.0" width="152.0" height="42" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="782.0" y="305.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">bus in: 6 V  GND</text><path d="M706,294.0 L350,294.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,294.0 L350,294.0" stroke="#f97316" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="294.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M706,306.0 L350,306.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,306.0 L350,306.0" stroke="#111827" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="306.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="528.0" y="276.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">674 mm run</text><rect x="50" y="262" width="300" height="76" rx="12" fill="#ffedd5" stroke="#334155" stroke-width="1.6"/><text x="200.0" y="286.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">6 V step-down (servos)</text><text x="200.0" y="306.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">in the bay, from the 24 V supply</text><text x="200.0" y="322.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">22 AWG red + black</text><rect x="706" y="499.0" width="152.0" height="42" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="782.0" y="525.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">bus in: SDA  SCL</text><path d="M706,514.0 L350,514.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,514.0 L350,514.0" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="514.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M706,526.0 L350,526.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,526.0 L350,526.0" stroke="#eab308" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="526.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="528.0" y="496.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">blue + yellow</text><rect x="50" y="482" width="300" height="76" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="200.0" y="506.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Pi 5 pins 3 + 5</text><text x="200.0" y="526.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">via the bay junction</text><text x="200.0" y="542.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">twist each with a GND</text><rect x="706" y="719.0" width="110" height="42" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="761.0" y="745.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">3.3 V out</text><path d="M706,734.0 L350,734.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,734.0 L350,734.0" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="734.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M706,746.0 L350,746.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,746.0 L350,746.0" stroke="#111827" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="746.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="528.0" y="716.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">logic power</text><rect x="50" y="702" width="300" height="76" rx="12" fill="#fce7f3" stroke="#334155" stroke-width="1.6"/><text x="200.0" y="726.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">All sensors + emitters</text><text x="200.0" y="746.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">from the regulator (6 V in)</text><rect x="1094.0" y="343.0" width="120.0" height="54" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="1154.0" y="375.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">PCA9685 ch N</text><path d="M1214.0,358.0 L1600,358.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1214.0,358.0 L1600,358.0" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/><circle cx="1214.0" cy="358.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M1214.0,370.0 L1600,370.0" stroke="#fff" stroke-width="8" stroke-li