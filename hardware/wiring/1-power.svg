<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1700" height="860" fill="#f8fafc"/><text x="36.0" y="50.0" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">1 · Power: the 24 V supply feeds everything</text><text x="36.0" y="80.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Mean Well LRS-100-24 in the base. All grounds are common (-V). Use your 22 AWG red + black, cut to length.</text><rect x="620" y="150" width="420" height="620" rx="14" fill="#475569" stroke="#022c22" stroke-width="2"/><circle cx="632" cy="162" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="1028" cy="162" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="632" cy="758" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="1028" cy="758" r="5" fill="#d1d5db" stroke="#022c22"/><text x="830.0" y="196.0" font-size="22" font-weight="800" fill="#ecfdf5" text-anchor="middle">24 V supply</text><text x="830.0" y="222.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">Mean Well LRS-100-24</text><text x="830.0" y="240.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">screw terminals on one end</text><rect x="626" y="273.0" width="110" height="54" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="681.0" y="305.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">L  N  ⏚</text><path d="M626,288.0 L340,288.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M626,288.0 L340,288.0" stroke="#92400e" stroke-width="5" stroke-linecap="round"/><circle cx="626" cy="288.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M626,300.0 L340,300.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M626,300.0 L340,300.0" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/><circle cx="626" cy="300.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M626,312.0 L340,312.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M626,312.0 L340,312.0" stroke="#65a30d" stroke-width="5" stroke-linecap="round"/><circle cx="626" cy="312.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="483.0" y="270.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">mains</text><rect x="60" y="262" width="280" height="76" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="1.6"/><text x="200.0" y="286.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">IEC inlet + switch</text><text x="200.0" y="306.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">back of the scan module</text><text x="200.0" y="322.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">its own pre-wired leads</text><rect x="924" y="229.0" width="110" height="42" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="979.0" y="255.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">+V  -V</text><path d="M1034,244.0 L1330,244.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1034,244.0 L1330,244.0" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/><circle cx="1034" cy="244.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M1034,256.0 L1330,256.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1034,256.0 L1330,256.0" stroke="#111827" stroke-width="5" stroke-linecap="round"/><circle cx="1034" cy="256.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="1182.0" y="226.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">126 mm (5.0 in)</text><rect x="1330" y="212" width="320" height="76" rx="12" fill="#d1fae5" stroke="#334155" stroke-width="1.6"/><text x="1490.0" y="236.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">SKR Pico VIN</text><text x="1490.0" y="256.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">screw terminal (sheet 2)</text><rect x="924" y="429.0" width="110" height="42" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="979.0" y="455.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">+V  -V</text><path d="M1034,444.0 L1330,444.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1034,444.0 L1330,444.0" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/><circle cx="1034" cy="444.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M1034,456.0 L1330,456.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1034,456.0 L1330,456.0" stroke="#111827" stroke-width="5" stroke-linecap="round"/><circle cx="1034" cy="456.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="1182.0" y="426.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">186 mm (7.3 in)</text><rect x="1330" y="412" width="320" height="76" rx="12" fill="#ffedd5" stroke="#334155" stroke-width="1.6"/><text x="1490.0" y="436.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">6 V step-down</text><text x="1490.0" y="456.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">for the servos (sheet 4)</text><rect x="924" y="629.0" width="110" height="42" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="979.0" y="655.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">+V  -V</text><path d="M1034,644.0 L1330,644.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1034,644.0 L1330,644.0" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/><circle cx="1034" cy="644.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M1034,656.0 L1330,656.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1034,656.0 L1330,656.0" stroke="#111827" stroke-width="5" stroke-linecap="round"/><circle cx="1034" cy="656.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="1182.0" y="626.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">298 mm (11.7 in)</text><rect x="1330" y="612" width="320" height="76" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="1.6"/><text x="1490.0" y="636.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">5 V USB-C converter</text><text x="1490.0" y="656.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">in the screen pod → Pi 5</text><text x="1490.0" y="672.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">runs with the Pi loom</text><text x="60.0" y="420.0" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">Unplug it from the wall before</text><text x="60.0" y="442.0" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">you touch the mains side.</text><text x="60.0" y="470.0" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Earth goes to the ⏚ screw.</text><text x="60.0" y="560.0" font-size="15" font-weight="800" fill="#0f172a" text-anchor="start">Wire colors on this sheet</text><path d="M60,582 L100,582" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/><text x="110.0" y="587.0" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">24 V (red)</text><path d="M60,603 L100,603" stroke="#111827" stroke-width="6" stroke-linecap="round"/><text x="110.0" y="608.0" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">GND (black)</text><path d="M60,624 L100,624" stroke="#92400e" stroke-width="6" stroke-linecap="round"/><text x="110.0" y="629.0" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">mains L (brown)</text><path d="M60,645 L100,645" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/><text x="110.0" y="650.0" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">mains N (blue)</text><path d="M60,666 L100,666" stroke="#65a30d" stroke-width="6" stroke-linecap="round"/><text x="110.0" y="671.0" font-size="13" font-weight="400" fill="#0f172a" text-