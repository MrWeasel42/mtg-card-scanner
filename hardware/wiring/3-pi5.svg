<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1230" viewBox="0 0 1850 1230" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1850" height="1230" fill="#f8fafc"/><text x="36.0" y="50.0" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">3 · Raspberry Pi 5 (in the screen pod): only 7 header pins are used</text><text x="36.0" y="80.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Pin numbers are the physical pins on the 40-pin header (pin 1 is the corner pin with the square pad).</text><rect x="700" y="140" width="440" height="800" rx="14" fill="#14532d" stroke="#022c22" stroke-width="2"/><circle cx="712" cy="152" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="1128" cy="152" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="712" cy="928" r="5" fill="#d1d5db" stroke="#022c22"/><circle cx="1128" cy="928" r="5" fill="#d1d5db" stroke="#022c22"/><text x="920.0" y="186.0" font-size="22" font-weight="800" fill="#ecfdf5" text-anchor="middle">Raspberry Pi 5</text><text x="920.0" y="212.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">runs the sorter app and</text><text x="920.0" y="230.0" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-style="italic">identifies cards</text><rect x="706" y="275.0" width="112.0" height="30" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="762.0" y="295.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">USB-C power</text><path d="M706,290.0 L330,290.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,290.0 L330,290.0" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="290.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="518.0" y="272.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">its own 12 in lead</text><rect x="50" y="252" width="280" height="76" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="1.6"/><text x="190.0" y="276.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">5 V USB-C converter</text><text x="190.0" y="296.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">24 V in from the supply</text><text x="190.0" y="312.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">(sheet 1)</text><rect x="706" y="465.0" width="110" height="30" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="761.0" y="485.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">CAM/DISP 0</text><path d="M706,480.0 L330,480.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,480.0 L330,480.0" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="480.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="518.0" y="462.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">camera ribbon</text><rect x="50" y="442" width="280" height="76" rx="12" fill="#e0e7ff" stroke="#334155" stroke-width="1.6"/><text x="190.0" y="466.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">HQ camera</text><text x="190.0" y="486.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">500 mm ribbon: out the pod back,</text><text x="190.0" y="502.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">one gentle twist, never folded</text><rect x="706" y="655.0" width="110" height="30" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="761.0" y="675.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">CAM/DISP 1</text><path d="M706,670.0 L330,670.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,670.0 L330,670.0" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="670.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="518.0" y="652.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">display ribbon</text><rect x="50" y="632" width="280" height="76" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="190.0" y="656.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Touch Display 2</text><text x="190.0" y="676.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">the display's own ribbon</text><text x="190.0" y="692.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">(in the box)</text><rect x="706" y="839.0" width="216.0" height="42" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="814.0" y="865.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">pin 2 (5 V)  pin 6 (GND)</text><path d="M706,854.0 L330,854.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,854.0 L330,854.0" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="854.0" r="3.8" fill="#facc15" stroke="#713f12"/><path d="M706,866.0 L330,866.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M706,866.0 L330,866.0" stroke="#111827" stroke-width="5" stroke-linecap="round"/><circle cx="706" cy="866.0" r="3.8" fill="#facc15" stroke="#713f12"/><text x="518.0" y="836.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">display power</text><rect x="50" y="822" width="280" height="76" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="190.0" y="846.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Touch Display 2 power</text><text x="190.0" y="866.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">the display's power lead</text><rect x="1024" y="285.0" width="110" height="30" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/><text x="1079.0" y="305.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">pin 8 (TX)</text><path d="M1134,300.0 L1510,300.0" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path 