# Card sorter settings. Distances in mm. The PC app's session decides which bin each card goes to.

pc:
  host: ""              # blank = find the PC automatically (PC app: Settings -> Phone link on)
  port: 8770
  poll_s: 2             # how often to ask the PC while paused or waiting for cards

bins:
  max: 9
  in_use: 3             # bins built, counted from the feeder; the last one is the end ramp (also Flagged).
                        # 3 = the test build (bin modules 1-2 + end module); set 9 when bin modules 3-8 are in.

moonraker: "http://127.0.0.1:7125"

track:
  pitch_mm: 122.0             # fin spacing = station spacing (61 belt teeth). Belt loop: 1220 mm (3 bins), 2684 mm (9 bins)
  index_speed: 120            # mm/s
  home_speed: 40
  home_search_mm: 300         # a fin passes the home sensor every 122 mm, so 300 always finds one
  home_to_station_mm: 94.5    # from the home sensor trigger to the next station; set with the fin gauge

feed:
  speed: 60
  max_to_sensor_mm: 160       # card must reach the card-clear sensor within this, else hopper empty / misfeed
  max_card_mm: 140            # ...and clear it within this (raw card is 88 long), else jam
  after_clear_mm: 10          # carry on so the tail leaves the exit nip before a fin comes down
  retries: 2                  # tries before calling the hopper empty
  empty_poll_s: 5             # hopper empty: try feeding again this often (never stops on its own)

doors:
  open_ms: 350                # time to let the card fall
  beam_timeout_ms: 600        # break-beam must see the card within this, else retry once
  beam_broken_when_low: true  # Adafruit IR break-beam receiver output
  servos:                     # one door per bin except the last; PCA9685 channel, pulse widths (us), tune by hand
    - {bin: 1, channel: 0, closed_us: 1000, open_us: 1700, beam_pin: 0}   # beam_pin: MCP23017 GPA pin on the hub
    - {bin: 2, channel: 1, closed_us: 1000, open_us: 1700, beam_pin: 1}
    - {bin: 3, channel: 2, closed_us: 1000, open_us: 1700, beam_pin: 2}
    - {bin: 4, channel: 3, closed_us: 1000, open_us: 1700, beam_pin: 3}
    - {bin: 5, channel: 4, closed_us: 1000, open_us: 1700, beam_pin: 4}
    - {bin: 6, channel: 5, closed_us: 1000, open_us: 1700, beam_pin: 5}
    - {bin: 7, channel: 6, closed_us: 1000, open_us: 1700, beam_pin: 6}
    - {bin: 8, channel: 7, closed_us: 1000, open_us: 1700, beam_pin: 7}
    # only the doors of bins 1 .. in_use-1 are used (the 3-bin test build has doors 1 and 2)

hub:                          # the bin hub on bin module 2's back panel (all on the Pi's I2C bus 1, run at 50 kHz)
  pca9685: 0x40               # door servos
  mcp23017: 0x20              # beam receivers
  tca9548a: [0x71, 0x72]      # bin-level sensors: bins 1-8 on switch 1 (A0 bridged), bin 9 on switch 2 (A1 bridged). Not 0x70: the PCA9685 answers its all-call there

levels:                       # VL53L1X above each bin (one per switch channel): distance to the top of the stack
  full_mm: 70                 # pause when the stack is closer than this
  check_every: 5              # cards

camera:
  width: 4056
  height: 3040
  exposure_us: 8000           # fixed exposure + gain under the hood LEDs
  gain: 1.0
  lights_pwm: 1.0
  settle_ms: 150              # after the track stops, before the photo
  undistort: true             # take the lens's barrel distortion out (after Tools -> lens calibration)
  lens_file: ~/sorter_data/lens.json
