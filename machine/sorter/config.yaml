# Card sorter settings (3-bin prototype). Distances in mm.

pc:
  host: ""              # blank = find the PC automatically (PC app: Settings -> Phone link on)
  port: 8770

moonraker: "http://127.0.0.1:7125"

track:
  pitch_mm: 105.0             # fin spacing = station spacing
  index_speed: 120            # mm/s
  home_speed: 40
  home_search_mm: 1150        # a bit more than one belt loop
  home_to_station_mm: 77.5    # from the home sensor trigger to the next station; set with the fin gauge
  stations: 5                 # 0 landing, 1 scan, 2 bin 1, 3 bin 2, 4 end ramp (bin 3)

feed:
  speed: 60
  max_to_sensor_mm: 160       # card must reach the card-clear sensor within this, else hopper empty / misfeed
  max_card_mm: 140            # ...and clear it within this (raw card is 88 long), else jam
  after_clear_mm: 10          # carry on so the tail leaves the exit nip before a fin comes down
  retries: 2                  # empty-hopper retries before stopping

doors:
  open_ms: 350                # time to let the card fall
  beam_timeout_ms: 600        # break-beam must see the card within this, else retry once
  beam_broken_when_low: true  # Adafruit IR break-beam receiver output
  servos:                     # PCA9685 channel and pulse widths (microseconds); tune each servo by hand
    - {bin: 1, channel: 0, closed_us: 1000, open_us: 1700, beam_gpio: 5}
    - {bin: 2, channel: 1, closed_us: 1000, open_us: 1700, beam_gpio: 6}

levels:                       # VL53L1X above each bin: distance to the top of the stack
  xshut_gpio: [17, 27, 22]    # bins 1, 2, 3
  full_mm: 70                 # pause when the stack is closer than this
  check_every: 5              # cards

camera:
  width: 4056
  height: 3040
  exposure_us: 8000           # fixed exposure + gain under the hood LEDs
  gain: 1.0
  lights_pwm: 1.0
  settle_ms: 150              # after the track stops, before the photo

# Which bin each card goes to: the first rule that matches wins. Bin 3 (end ramp) catches everything else.
# Keys: ok, pinned, finish_unsure, min_price, max_price, set_codes, name_contains
rules:
  - {bin: 1, name: "Confirmed", ok: true, pinned: true, finish_unsure: false}
  - {bin: 2, name: "Check on the PC", ok: true}
  - {bin: 3, name: "No card / not read"}
