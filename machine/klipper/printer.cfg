# Klipper config for the card sorter (BIGTREETECH SKR Pico v1.0 on the Pi 5's GPIO UART).
# Not a printer: no axes, just two "manual steppers" plus a few sensors and the light switch.
#
# Wiring summary (full diagram: the "Sorter Wiring" page):
#   X driver  -> feed motor (feed roller + exit rollers via the 122 mm loop)
#   Y driver  -> track motor (end-module drive shaft, both edge belts)
#   X-STOP    -> card-clear TCRT5000 (under the floor at the feeder exit, X 127)
#   Y-STOP    -> belt-home TCRT5000 (under the scan module's back strip, sees each fin go past)
#   Z-STOP    -> tower-ID hall sensor 1 (A3144, front: magnet = raw or double-sleeved tower)
#   E0-STOP   -> tower-ID hall sensor 2 (A3144, back: magnet = single or double-sleeved tower)
#               (A3144 VCC from the probe header's 5 V pin; its output is open-collector, pulled up to 3.3 V here)
#   HE0       -> hood COB LED strips (24 V, switched by the board's heater MOSFET)
#   FAN2      -> sheen LED (up to 52 mm of COB strip in sheen_cap; set FAN2's voltage jumper to VIN = 24 V)
#   FAN3      -> optional 30 mm bay fan (24 V fan; FAN3 jumper on VIN)
#   VIN       <- PSU 24 V.   UART header -> Pi 5 GPIO 14/15 + GND (jumper loom from the screen pod)
# Full cable list with routes and lengths: hardware/WIRING.md
# The TCRT modules run on 3.3 V (the RP2040 pins are NOT 5 V tolerant). Their output goes LOW when they see
# something, hence the "!" on the pins below.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_CHANGE_ME   # USB-C to the Pi; get yours with: ls /dev/serial/by-id/
restart_method: command

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# ---------------------------------------------------------------- track (edge belts, fins every 122 mm)
[manual_stepper track]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 60          # printed 30-tooth GT2 pulley: 30 x 2 mm per turn
velocity: 120
accel: 1200
endstop_pin: !gpio3            # belt-home sensor: triggered while a fin is over it

[tmc2209 manual_stepper track]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.8
stealthchop_threshold: 999999  # quiet

# ---------------------------------------------------------------- feed (feed roller + exit rollers)
[manual_stepper feed]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 74.1        # roller with 16 x 3.5 O-rings, D 23.6 mm: pi x 23.6
velocity: 100
accel: 800
endstop_pin: !gpio4            # card-clear sensor: triggered while a card is over it

[tmc2209 manual_stepper feed]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.8
stealthchop_threshold: 999999

# the card-clear and home sensors are also readable on their own (sorter checks them between moves)
[duplicate_pin_override]
pins: gpio3, gpio4

[gcode_button card_clear]
pin: !gpio4
press_gcode:
release_gcode:

[gcode_button belt_home]
pin: !gpio3
press_gcode:
release_gcode:

# tower ID: LOW (magnet over the sensor) = pressed
[gcode_button tower_a]
pin: ^!gpio25
press_gcode:
release_gcode:

[gcode_button tower_b]
pin: ^!gpio16
press_gcode:
release_gcode:

# ---------------------------------------------------------------- lights
[output_pin lights]
pin: gpio23                    # HE0 output (24 V low-side MOSFET) -> COB strip
pwm: True
cycle_time: 0.002
value: 0
shutdown_value: 0

[output_pin sheen]
pin: gpio18                    # FAN2 output -> sheen LED (low-angle light through the hood's back wall)
pwm: True
cycle_time: 0.002
value: 0
shutdown_value: 0

[fan_generic bay_fan]
pin: gpio20                    # FAN3 output -> optional 30 mm fan in the bay cover

[idle_timeout]
timeout: 600                   # motors release after 10 minutes idle
